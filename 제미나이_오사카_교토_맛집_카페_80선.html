<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>오사카 & 교토 맛집·카페 가이드 80</title>
  <!-- Leaflet CSS & JS for Map Rendering (CDN) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --tag-osaka: #fee2e2;
      --tag-osaka-text: #b91c1c;
      --tag-kyoto: #dcfce7;
      --tag-kyoto-text: #15803d;
      --tag-food: #ffedd5;
      --tag-food-text: #c2410c;
      --tag-cafe: #f3e8ff;
      --tag-cafe-text: #7e22ce;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    /* Header */
    header {
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }

    .counter {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }

    /* Map Container */
    #map-wrapper {
      position: sticky;
      top: calc(var(--safe-top) + 49px);
      z-index: 999;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    #map {
      width: 100%;
      height: 220px;
      background: #e5e7eb;
    }

    /* Filter Controls */
    .controls {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      background: #f1f5f9;
    }

    .search-input:focus {
      border-color: var(--primary);
      background: #ffffff;
    }

    .filter-group {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-group::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 5px 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Place List */
    #list-container {
      flex: 1;
      padding: 12px 16px calc(var(--safe-bottom) + 20px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .place-card:active {
      background: #f8fafc;
      transform: scale(0.99);
    }

    .place-card.selected {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .place-name {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }

    .badges {
      display: flex;
      gap: 4px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-osaka { background: var(--tag-osaka); color: var(--tag-osaka-text); }
    .badge-kyoto { background: var(--tag-kyoto); color: var(--tag-kyoto-text); }
    .badge-food { background: var(--tag-food); color: var(--tag-food-text); }
    .badge-cafe { background: var(--tag-cafe); color: var(--tag-cafe-text); }

    .place-area {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .place-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.4;
    }

    .place-menu {
      font-size: 12px;
      color: var(--primary-dark);
      background: rgba(37, 99, 235, 0.06);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-gmaps {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-gmaps:hover, .btn-gmaps:active {
      background: #e2e8f0;
      color: #0f172a;
    }

    .btn-gmaps svg {
      width: 14px;
      height: 14px;
      fill: #ea4335;
    }

    .popup-content {
      font-family: inherit;
      line-height: 1.4;
    }

    .popup-title {
      font-weight: 700;
      font-size: 13px;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .popup-menu {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .popup-link {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
    }

    .empty-msg {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>

    { id: 70, city: "교토", type: "카페", name: "츠지리헤이 본점", query: "Tsujirihei Honten Uji Kyoto", area: "우지", lat: 34.8935, lng: 135.8000, desc: "고즈넉한 정원을 감상하며 극상의 쌉싸름함을 즐기는 말차 몽블랑.", menu: "말차 몽블랑, 농차 아이스크림" },
    { id: 71, city: "교토", type: "카페", name: "사료 츠지리 기온 본점", query: "Saryo Tsujiri Gion Main Store Kyoto", area: "기온", lat: 35.0035, lng: 135.7755, desc: "교토 말차 파르페의 기준. 층마다 재료가 풍성한 프리미엄 파르페.", menu: "특선 츠지리 말차 파르페" },
    { id: 72, city: "교토", type: "카페", name: "잇포도 티룸 카보 (Ippodo Tea)", query: "Ippodo Tea Kyoto Main Store", area: "교토시청 인근", lat: 35.0130, lng: 135.7680, desc: "300년 전통 차 명가. 직접 차를 우려 마시는 정갈한 다도 체험.", menu: "말차 세트, 옥로차(교쿠로)" },
    { id: 73, city: "교토", type: "카페", name: "사료 호센", query: "Saryo Hosen Kyoto", area: "시모가모", lat: 35.0420, lng: 135.7740, desc: "일본 정원을 조망하며 주문 즉시 만드는 투명한 와라비모찌 즐기기.", menu: "수제 와라비모찌, 말차" },
    { id: 74, city: "교토", type: "카페", name: "기온 토쿠야", query: "Gion Tokuya Kyoto", area: "기온 (하나미코지)", lat: 35.0030, lng: 135.7745, desc: "놋그릇 얼음 위에 얹은 차가운 와라비모찌와 구워 먹는 찰떡.", menu: "토쿠야 와라비모찌, 구운 모찌" },
    { id: 75, city: "교토", type: "카페", name: "사오리 본점 (紗織)", query: "Waguri Saori Kyoto", area: "기온·가와라마치", lat: 35.0015, lng: 135.7700, desc: "1mm 두께로 가늘게 뽑아내는 최고급 밤 앙금 실타래 몽블랑 본점.", menu: "사오리 밤 몽블랑(로)" },
    { id: 76, city: "교토", type: "카페", name: "스마트 커피 (Smart Coffee)", query: "Smart Coffee Kyoto", area: "테라마치 상점가", lat: 35.0090, lng: 135.7672, desc: "1932년 창업 킷사텐. 도톰한 프렌치토스트와 핫케이크, 진한 커피.", menu: "프렌치토스트, 자체 로스팅 커피" },
    { id: 77, city: "교토", type: "카페", name: "프랑소아 찻집", query: "Salon de the Francois Kyoto", area: "가와라마치", lat: 35.0032, lng: 135.7702, desc: "국가 등록유형문화재 지정 바로크풍 살롱에서 즐기는 비엔나커피.", menu: "비엔나커피, 레어 치즈케이크" },
    { id: 78, city: "교토", type: "카페", name: "킷사 소와레 (Soiree)", query: "Kissa Soiree Kyoto", area: "폰토초 인근", lat: 35.0040, lng: 135.7708, desc: "신비로운 푸른빛 조명 아래 5색 젤리가 보석처럼 빛나는 젤리 펀치.", menu: "젤리 펀치, 젤리 소다" },
    { id: 79, city: "교토", type: "카페", name: "우메조노 카페 앤 갤러리", query: "Umezono CAFE & GALLERY Kyoto", area: "가라스마", lat: 35.0068, lng: 135.7575, desc: "네모반듯하게 구워낸 폭신한 말차 팬케이크와 팥앙금의 조화.", menu: "말차 팬케이크, 미타라시 당고" },
    { id: 80, city: "교토", type: "카페", name: "마루후쿠 커피점 교토 포르타점", query: "Marufuku Coffee Kyoto Porta", area: "교토역", lat: 34.9858, lng: 135.7590, desc: "1934년 창업 전통의 진한 다크 로스팅 드립 커피와 수제 핫케이크.", menu: "수제 핫케이크 세트, 다크 커피" }
  ];

  function getGoogleMapsUrl(place) {
    const q = encodeURIComponent(`${place.query || place.name}`);
    return `https://www.google.com/maps/search/?api=1&query=${q}&query_place_id=&center=${place.lat},${place.lng}`;
  }

  // App State with LocalStorage wrapper
  const StateStorage = {
    get(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch (e) {
        return defaultVal;
      }
    },
    set(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }
  };

  let currentCity = StateStorage.get('app_city', 'ALL');
  let currentType = StateStorage.get('app_type', 'ALL');
  let searchQuery = '';
  let selectedPlaceId = StateStorage.get('app_selected_id', null);

  // Initialize Map
  const map = L.map('map', {
    zoomControl: false
  }).setView([34.83, 135.63], 10);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let markers = {};

  // Custom Markers
  function createMarkerIcon(isSelected) {
    return L.divIcon({
      className: 'custom-map-pin',
      html: `<div style="
        background-color: ${isSelected ? '#dc2626' : '#2563eb'};
        width: ${isSelected ? '16px' : '12px'};
        height: ${isSelected ? '16px' : '12px'};
        border-radius: 50%;
        border: 2px solid #ffffff;
        box-shadow: 0 0 4px rgba(0,0,0,0.4);
        transition: all 0.2s;
      "></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
  }

  function renderMarkers(filteredPlaces) {
    // Clear old markers
    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};

    filteredPlaces.forEach(place => {
      const isSelected = place.id === selectedPlaceId;
      const marker = L.marker([place.lat, place.lng], {
        icon: createMarkerIcon(isSelected)
      }).addTo(map);

      marker.on('click', () => {
        selectPlace(place.id, true);
      });

      const gmapsUrl = getGoogleMapsUrl(place);
      const popupHtml = `
        <div class="popup-content">
          <div class="popup-title">${place.name}</div>
          <div class="popup-menu">${place.menu}</div>
          <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" class="popup-link">📍 구글지도에서 열기 ↗</a>
        </div>
      `;

      marker.bindPopup(popupHtml);
      markers[place.id] = marker;
    });
  }

  function renderList() {
    const listContainer = document.getElementById('list-container');
    const counter = document.getElementById('item-counter');

    const filtered = placesData.filter(place => {
      const matchCity = currentCity === 'ALL' || place.city === currentCity;
      const matchType = currentType === 'ALL' || place.type === currentType;
      const q = searchQuery.toLowerCase().trim();
      const matchQuery = !q || 
        place.name.toLowerCase().includes(q) || 
        place.area.toLowerCase().includes(q) || 
        place.desc.toLowerCase().includes(q) || 
        place.menu.toLowerCase().includes(q);

      return matchCity && matchType && matchQuery;
    });

    counter.innerText = `${filtered.length} / ${placesData.length}`;

    if (filtered.length === 0) {
      listContainer.innerHTML = `<div class="empty-msg">조건에 맞는 장소가 없습니다.</div>`;
      renderMarkers([]);
      return;
    }

    renderMarkers(filtered);

    listContainer.innerHTML = filtered.map(place => {
      const isSelected = place.id === selectedPlaceId;
      const cityBadge = place.city === '오사카' ? 'badge-osaka' : 'badge-kyoto';
      const typeBadge = place.type === '식당' ? 'badge-food' : 'badge-cafe';
      const gmapsUrl = getGoogleMapsUrl(place);

      return `
        <div class="place-card ${isSelected ? 'selected' : ''}" id="card-${place.id}" onclick="selectPlace(${place.id}, false)">
          <div class="card-top">
            <span class="place-name">${place.name}</span>
            <div class="badges">
              <span class="badge ${cityBadge}">${place.city}</span>
              <span class="badge ${typeBadge}">${place.type}</span>
            </div>
          </div>
          <div class="place-area">📍 ${place.area}</div>
          <div class="place-desc">${place.desc}</div>
          <div class="place-menu">✨ 추천: ${place.menu}</div>
          <div class="card-actions">
            <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-gmaps" onclick="event.stopPropagation()">
              <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
              구글지도 열기
            </a>
          </div>
        </div>
      `;
    }).join('');

    if (selectedPlaceId) {
      const selectedCard = document.getElementById(`card-${selectedPlaceId}`);
      if (selectedCard) {
        selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }

  function selectPlace(id, fromMarker = false) {
    selectedPlaceId = id;
    StateStorage.set('app_selected_id', id);

    const place = placesData.find(p => p.id === id);
    if (!place) return;

    // Update map view & popup
    map.flyTo([place.lat, place.lng], 14, { duration: 0.6 });

    // Update markers icons
    Object.keys(markers).forEach(k => {
      const mId = parseInt(k, 10);
      markers[mId].setIcon(createMarkerIcon(mId === id));
    });

    if (markers[id]) {
      markers[id].openPopup();
    }

    // Update selected card styling
    document.querySelectorAll('.place-card').forEach(c => c.classList.remove('selected'));
    const targetCard = document.getElementById(`card-${id}`);
    if (targetCard) {
      targetCard.classList.add('selected');
      if (fromMarker) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  // Event Listeners
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const city = btn.getAttribute('data-city');
      const type = btn.getAttribute('data-type');

      if (city) {
        document.querySelectorAll('[data-city]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCity = city;
        StateStorage.set('app_city', city);
      }
      if (type) {
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = type;
        StateStorage.set('app_type', type);
      }

      renderList();
    });
  });

  const searchBox = document.getElementById('search-box');
  searchBox.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderList();
  });

  // Restore saved filter UI state
  if (currentCity) {
    document.querySelectorAll('[data-city]').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-city') === currentCity);
    });
  }
  if (currentType) {
    document.querySelectorAll('[data-type]').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-type') === currentType);
    });
  }

  // Initial Render
  renderList();
  if (selectedPlaceId) {
    const p = placesData.find(x => x.id === selectedPlaceId);
    if (p) {
      map.setView([p.lat, p.lng], 13);
    }
  }
</script>
</body>
</html>
